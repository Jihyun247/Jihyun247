name: F1 Telemetry

on:
  schedule:
    # 매일 00:10 UTC (한국시간 09:10)
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/telemetry.py"
      - ".github/workflows/f1-telemetry.yml"

permissions:
  contents: write

concurrency:
  group: f1-telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render timing tower
        env:
          # 비공개 레포까지 집계하려면 repo 스코프 PAT를 GH_PAT 시크릿으로 넣으세요.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TIMEZONE: Asia/Seoul
          MAX_REPOS: "60"
          MAX_PAGES: "5"
        run: python scripts/telemetry.py

      - name: Commit
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "no telemetry change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update F1 telemetry"
          git push
